launch:
  - arg:
      name: "vocab"
      default: $(find-pkg-share orbslam3)/vocabulary/ORBvoc.txt
  - arg:
      name: "config"
      default: $(find-pkg-share orbslam3)/config/stereo-inertial/EuRoC.yaml
  - arg:
      name: "rectify"
      default: "false"
  - arg:
      name: "equalize"
      default: "false"
  - arg:
      name: "camera_name"
      default: "camera"
  - node:
      pkg: "orbslam3"
      exec: "stereo-inertial"
      name: "orbslam3"
      args: $(var vocab) $(var config) $(var rectify) $(var equalize)
      remap:
        -
          from: "/camera/left"
          to: "/cam0/image_raw"
        -
          from: "/camera/right"
          to: "/cam1/image_raw"
        -
          from: "/imu"
          to: "/imu0"
